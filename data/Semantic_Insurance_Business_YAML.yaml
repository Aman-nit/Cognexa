business_domain:
  name: "Insurance Claims Investigation & Policy Intelligence"
  version: "1.0"
  owner: "Claims Investigation and Risk Management Team"
  description: >
    This semantic business layer provides a unified view of insurance policies,
    policyholders, covered vehicles, incidents, and claims. It supports claims
    investigation, policy servicing, risk assessment, fraud analysis, customer
    inquiry resolution, natural-language querying, and evidence-based decision
    support.
  default_currency: "USD"
  semantic_search_enabled: true
  structured_query_enabled: true

business_objective:
  primary_goal: "Enable accurate, explainable, and evidence-based claim investigation and policy analysis."
  secondary_goals:
    - "Identify claims requiring manual investigation."
    - "Detect potential fraud indicators and suspicious claim patterns."
    - "Provide policy coverage and claim insights to business users."
    - "Support investigator and claims-adjuster decision-making."
    - "Improve claim-processing efficiency and consistency."
    - "Enable natural-language querying of policy and claims data."
    - "Support risk assessment and underwriting reviews."
    - "Provide evidence for claim approval, rejection, verification, or escalation."

source_system:
  name: "Insurance Claims Analytical Repository"
  source_type: "DuckDB"
  database:
    engine: "DuckDB"
    schema: "main"
    tables:
      - insured
      - policy
      - vehicle
      - incident
      - claim
    description: >
      Normalized insurance policyholder, policy, vehicle, incident, and claim
      data stored in DuckDB and used for investigation, reporting, semantic
      retrieval, natural-language-to-SQL, and AI-assisted analysis.

business_capabilities:
  - "Claim Investigation"
  - "Fraud Analysis"
  - "Policy Coverage Lookup"
  - "Customer Risk Profiling"
  - "Underwriting Review"
  - "Escalation Decisioning"

business_users:
  - role: "Claims Investigator"
    needs: "Fast, evidence-backed answers to specific claim questions without writing SQL."
  - role: "Claims Adjuster"
    needs: "Coverage and policy details to approve, reject, or escalate a claim."
  - role: "Fraud Analyst"
    needs: "Identification of suspicious patterns and applicable fraud rules."
  - role: "Underwriter"
    needs: "Risk profile of the policyholder and vehicle at time of claim."

semantic_configuration:
  retrieval_mode: "hybrid"
  structured_retrieval_source: "DuckDB"
  semantic_knowledge_source: "This YAML document"
  query_language: "DuckDB SQL"
  llm_target: "Phi-3"
  instructions:
    - "Use entity names, attributes, synonyms, relationships, rules, and metrics to interpret the question."
    - "Generate read-only SELECT statements only."
    - "Use documented joins and never invent tables, columns, values, or business rules."
    - "Retrieve evidence from DuckDB before producing a factual answer."
    - "If required data is unavailable, state that the answer cannot be determined from the available data."
    - "Distinguish a source fraud label from an investigation recommendation."
    - "A warning or investigation recommendation does not prove fraud."
    - "Reference applicable rule IDs when explaining an investigation decision."
  answer_policy:
    initial_summary_sentences: "2-3"
    include_evidence: true
    include_applied_rules: true
    include_generated_sql: true
    avoid_hallucination: true

# ==========================================================================
# ENTITIES — mirrors the 5 DuckDB tables built from the source Excel workbook
# ==========================================================================
entities:

  - entity_name: "insured"
    business_name: "Policyholder"
    business_description: "Person insured under an insurance policy."
    primary_key: "insured_id"
    synonyms:
      - "insured"
      - "customer"
      - "policyholder"
      - "client"
    attributes:
      - name: "insured_id"
        business_name: "Customer Identifier"
        type: "BIGINT"
        synonyms: ["customer id", "insured id", "policyholder id"]
      - name: "insured_zip"
        business_name: "Insured ZIP Code"
        type: "INTEGER"
        synonyms: ["zip code", "postal code", "customer location"]
        sensitive: true
      - name: "age"
        business_name: "Customer Age"
        type: "INTEGER"
        synonyms: ["insured age", "policyholder age"]
      - name: "gender"
        business_name: "Gender"
        type: "VARCHAR"
        synonyms: ["insured gender", "sex"]
        sensitive: true
      - name: "education_level"
        business_name: "Education Level"
        type: "VARCHAR"
        synonyms: ["education", "qualification"]
      - name: "occupation"
        business_name: "Occupation"
        type: "VARCHAR"
        synonyms: ["job", "profession", "employment"]
      - name: "hobbies"
        business_name: "Hobbies"
        type: "VARCHAR"
        synonyms: ["hobby", "interests"]
      - name: "relationship"
        business_name: "Insured Relationship"
        type: "VARCHAR"
        synonyms: ["family relationship", "relationship to policyholder"]
      - name: "capital_gains"
        business_name: "Capital Gains"
        type: "INTEGER"
        synonyms: ["financial gains", "investment gains"]
      - name: "capital_loss"
        business_name: "Capital Loss"
        type: "INTEGER"
        synonyms: ["financial loss", "investment loss"]

  - entity_name: "policy"
    business_name: "Insurance Policy"
    business_description: "Coverage contract issued to a policyholder."
    primary_key: "policy_number"
    synonyms:
      - "policy"
      - "coverage"
      - "insurance policy"
      - "contract"
    attributes:
      - name: "policy_number"
        business_name: "Policy Number"
        type: "BIGINT"
        synonyms: ["policy id", "policy no"]
      - name: "insured_id"
        business_name: "Policyholder Reference"
        type: "BIGINT"
        synonyms: ["customer id", "insured id"]
      - name: "months_as_customer"
        business_name: "Customer Tenure (Months)"
        type: "INTEGER"
        synonyms: ["tenure", "how long a customer", "customer since"]
      - name: "policy_bind_date"
        business_name: "Policy Start Date"
        type: "DATE"
        synonyms: ["policy issued date", "coverage start date"]
      - name: "policy_state"
        business_name: "Policy State"
        type: "VARCHAR"
        synonyms: ["state", "issuing state"]
      - name: "policy_csl"
        business_name: "Combined Single Limit"
        type: "VARCHAR"
        synonyms: ["csl", "liability limit"]
      - name: "policy_deductible"
        business_name: "Policy Deductible"
        type: "INTEGER"
        synonyms: ["deductible amount"]
      - name: "policy_annual_premium"
        business_name: "Annual Premium"
        type: "FLOAT"
        synonyms: ["premium", "yearly premium"]
      - name: "umbrella_limit"
        business_name: "Umbrella Coverage Limit"
        type: "INTEGER"
        synonyms: ["umbrella policy limit", "excess liability limit"]

  - entity_name: "vehicle"
    business_name: "Covered Vehicle"
    business_description: "Vehicle covered under a given policy."
    primary_key: "vehicle_id"
    synonyms:
      - "vehicle"
      - "car"
      - "auto"
      - "covered vehicle"
    attributes:
      - name: "vehicle_id"
        business_name: "Vehicle Identifier"
        type: "BIGINT"
        synonyms: ["vehicle id"]
      - name: "policy_number"
        business_name: "Policy Reference"
        type: "BIGINT"
        synonyms: ["policy id", "policy no"]
      - name: "auto_make"
        business_name: "Vehicle Make"
        type: "VARCHAR"
        synonyms: ["car brand", "manufacturer"]
      - name: "auto_model"
        business_name: "Vehicle Model"
        type: "VARCHAR"
        synonyms: ["car model"]
      - name: "auto_year"
        business_name: "Vehicle Year"
        type: "INTEGER"
        synonyms: ["model year", "year of manufacture"]

  - entity_name: "incident"
    business_name: "Incident"
    business_description: "The event that led to a claim being filed."
    primary_key: "incident_id"
    synonyms:
      - "incident"
      - "accident"
      - "event"
      - "occurrence"
    attributes:
      - name: "incident_id"
        business_name: "Incident Identifier"
        type: "BIGINT"
        synonyms: ["incident id"]
      - name: "policy_number"
        business_name: "Policy Reference"
        type: "BIGINT"
        synonyms: ["policy id", "policy no"]
      - name: "incident_date"
        business_name: "Incident Date"
        type: "DATE"
        synonyms: ["date of accident", "when it happened"]
      - name: "incident_type"
        business_name: "Incident Type"
        type: "VARCHAR"
        synonyms: ["type of accident", "kind of incident"]
        allowed_values: ["Single Vehicle Collision", "Multi-vehicle Collision", "Vehicle Theft", "Parked Car"]
      - name: "collision_type"
        business_name: "Collision Type"
        type: "VARCHAR"
        synonyms: ["type of collision"]
        allowed_values: ["Side Collision", "Front Collision", "Rear Collision", null]
      - name: "incident_severity"
        business_name: "Incident Severity"
        type: "VARCHAR"
        synonyms: ["severity", "damage severity"]
        allowed_values: ["Trivial Damage", "Minor Damage", "Major Damage", "Total Loss"]
      - name: "authorities_contacted"
        business_name: "Authorities Contacted"
        type: "VARCHAR"
        synonyms: ["who was contacted", "reported to"]
        allowed_values: ["Police", "Fire", "Ambulance", "Other", null]
      - name: "incident_state"
        business_name: "Incident State"
        type: "VARCHAR"
        synonyms: ["state where it happened"]
      - name: "incident_city"
        business_name: "Incident City"
        type: "VARCHAR"
        synonyms: ["city where it happened"]
      - name: "incident_location"
        business_name: "Incident Location"
        type: "VARCHAR"
        synonyms: ["address", "location of incident"]
      - name: "incident_hour_of_day"
        business_name: "Incident Hour"
        type: "INTEGER"
        synonyms: ["time of day", "hour of incident"]
      - name: "vehicles_involved"
        business_name: "Number of Vehicles Involved"
        type: "INTEGER"
        synonyms: ["how many vehicles"]
      - name: "property_damage"
        business_name: "Property Damage Reported"
        type: "VARCHAR"
        synonyms: ["was there property damage"]
        allowed_values: ["YES", "NO", null]
      - name: "bodily_injuries"
        business_name: "Bodily Injuries Count"
        type: "INTEGER"
        synonyms: ["number of injuries"]
      - name: "witnesses"
        business_name: "Witness Count"
        type: "INTEGER"
        synonyms: ["number of witnesses"]
      - name: "police_report_available"
        business_name: "Police Report Available"
        type: "VARCHAR"
        synonyms: ["was a police report filed"]
        allowed_values: ["YES", "NO", null]

  - entity_name: "claim"
    business_name: "Claim"
    business_description: "The monetary claim filed against a policy for a given incident."
    primary_key: "claim_id"
    synonyms:
      - "claim"
      - "insurance claim"
      - "loss claim"
    attributes:
      - name: "claim_id"
        business_name: "Claim Identifier"
        type: "BIGINT"
        synonyms: ["claim id", "claim number"]
      - name: "incident_id"
        business_name: "Incident Reference"
        type: "BIGINT"
        synonyms: ["incident id"]
      - name: "total_claim_amount"
        business_name: "Total Claim Amount"
        type: "INTEGER"
        synonyms: ["claim value", "amount claimed", "total loss amount"]
      - name: "injury_claim"
        business_name: "Injury Claim Amount"
        type: "INTEGER"
        synonyms: ["bodily injury claim"]
      - name: "property_claim"
        business_name: "Property Claim Amount"
        type: "INTEGER"
        synonyms: ["property damage claim"]
      - name: "vehicle_claim"
        business_name: "Vehicle Claim Amount"
        type: "INTEGER"
        synonyms: ["auto damage claim"]
      - name: "fraud_reported"
        business_name: "Source Fraud Label"
        type: "VARCHAR"
        synonyms: ["is it fraud", "fraud flag"]
        allowed_values: ["Y", "N"]
        note: >
          This is a historical/source-of-truth label from the dataset, not a
          live investigation output. Never treat this as something the system
          "detected" — it must be described as data already present in the
          source record.

# ==========================================================================
# RELATIONSHIPS — how the 5 entities join together
# ==========================================================================
relationships:
  - id: "REL001"
    from: "insured"
    to: "policy"
    join_on: "insured.insured_id = policy.insured_id"
    cardinality: "one-to-many"
    description: "A policyholder can hold one or more policies."

  - id: "REL002"
    from: "policy"
    to: "vehicle"
    join_on: "policy.policy_number = vehicle.policy_number"
    cardinality: "one-to-many"
    description: "A policy covers one or more vehicles."

  - id: "REL003"
    from: "policy"
    to: "incident"
    join_on: "policy.policy_number = incident.policy_number"
    cardinality: "one-to-many"
    description: "A policy can have one or more incidents reported against it."

  - id: "REL004"
    from: "incident"
    to: "claim"
    join_on: "incident.incident_id = claim.incident_id"
    cardinality: "one-to-one"
    description: "Each incident generates exactly one claim record."

# ==========================================================================
# BUSINESS RULES — fraud, underwriting, and escalation logic
# Referenced by ID (e.g. BR005, BR009) in generated answers, per the
# "Envelope Assembled" step of the pipeline.
# ==========================================================================
business_rules:

  - rule_id: "BR001"
    name: "High claim relative to premium"
    category: "fraud"
    condition: "claim.total_claim_amount > (policy.policy_annual_premium * 40)"
    explanation: >
      A claim amount more than 40x the policyholder's annual premium is
      disproportionate and warrants closer review of the incident details.
    severity: "warning"

  - rule_id: "BR002"
    name: "Early claim after policy start"
    category: "fraud"
    condition: "policy.months_as_customer < 3 AND claim.total_claim_amount > 30000"
    explanation: >
      A high-value claim filed within the first 3 months of a policy is a
      recognized pattern associated with intent-to-defraud at signup.
    severity: "warning"

  - rule_id: "BR003"
    name: "No witnesses on a multi-party incident"
    category: "fraud"
    condition: "incident.witnesses = 0 AND incident.incident_type != 'Parked Car'"
    explanation: >
      Zero witnesses on an incident involving other parties or vehicles
      reduces independent verification and raises investigative priority.
    severity: "info"

  - rule_id: "BR004"
    name: "High severity but no authorities contacted"
    category: "fraud"
    condition: "incident.incident_severity IN ('Major Damage', 'Total Loss') AND incident.authorities_contacted IS NULL"
    explanation: >
      Major damage or total loss incidents are ordinarily reported to some
      authority (police, fire, ambulance). Absence of any contact is
      inconsistent with the claimed severity.
    severity: "warning"

  - rule_id: "BR005"
    name: "No police report expected for theft claims"
    category: "underwriting"
    condition: "incident.incident_type = 'Vehicle Theft' AND incident.police_report_available = 'NO'"
    explanation: >
      For vehicle theft claims specifically, a missing police report is a
      known and expected gap in this dataset and should not, by itself, be
      treated as suspicious.
    severity: "info"

  - rule_id: "BR006"
    name: "Property damage reported with zero property claim"
    category: "fraud"
    condition: "incident.property_damage = 'YES' AND claim.property_claim = 0"
    explanation: >
      Reported property damage with no corresponding property claim amount
      is an internal inconsistency worth flagging for review.
    severity: "warning"

  - rule_id: "BR007"
    name: "Bodily injury reported with zero injury claim"
    category: "fraud"
    condition: "incident.bodily_injuries > 0 AND claim.injury_claim = 0"
    explanation: >
      Bodily injuries recorded on the incident but no injury claim amount
      is an inconsistency between the incident record and the claim record.
    severity: "warning"

  - rule_id: "BR008"
    name: "High umbrella limit policy"
    category: "underwriting"
    condition: "policy.umbrella_limit >= 5000000"
    explanation: >
      Policies with an umbrella limit of $5,000,000 or more carry higher
      exposure and should be reviewed with additional scrutiny regardless
      of claim outcome.
    severity: "info"

  - rule_id: "BR009"
    name: "High-value claim warning threshold"
    category: "escalation"
    condition: "claim.total_claim_amount > 81400"
    explanation: >
      This threshold corresponds to the 90th percentile of total claim
      amounts in the historical dataset. Claims above it are flagged for
      supervisory review regardless of other rule outcomes.
    severity: "warning"

  - rule_id: "BR010"
    name: "Aging vehicle high-value claim"
    category: "underwriting"
    condition: "(2015 - vehicle.auto_year) > 15 AND claim.vehicle_claim > 40000"
    explanation: >
      A high vehicle-damage claim on a vehicle older than 15 years at time
      of incident is disproportionate to typical depreciated vehicle value
      and warrants valuation review.
    severity: "warning"

  - rule_id: "BR011"
    name: "Escalate to human review"
    category: "escalation"
    condition: "TRIGGERED_RULE_COUNT(category='fraud') >= 2"
    explanation: >
      Two or more independently triggered fraud-category rules on the same
      claim moves the recommendation from a system-generated warning to a
      mandatory human investigator review. The system never auto-decides
      fraud; it only ever recommends escalation.
    severity: "escalation"

# ==========================================================================
# ANSWER CONSTRUCTION RULES
# ==========================================================================
answer_construction:
  never_state_as_fact:
    - "That a claim is fraudulent, beyond restating the source fraud_reported label."
    - "Any number, date, or name not present in the DuckDB query result."
  always_include:
    - "The generated SQL used to retrieve the evidence."
    - "The rule ID(s) that were evaluated and which ones triggered."
    - "A plain-language explanation tying evidence to the recommendation."
  recommendation_values:
    - "Approve"
    - "Review"
    - "Investigate"
